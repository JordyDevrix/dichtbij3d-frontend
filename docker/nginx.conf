# Map to detect client scheme across reverse proxies
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Social media link preview bots and chat scrapers
map $http_user_agent $is_crawler {
    default 0;
    ~*(facebookexternalhit|Facebot|Twitterbot|Discordbot|WhatsApp|TelegramBot|Slackbot|LinkedInBot|Applebot|Pinterest|redditbot|SkypeUriPreview|Microsoft-WebPreview|BingPreview|vkShare|kakaotalk-scrap|Line\/) 1;
}

server {
    listen       ${PORT};
    server_name  _;
    root         /usr/share/nginx/html;

    client_max_body_size 128M;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Runtime configuration; never cached so a container restart takes effect.
    location = /env.js {
        add_header Cache-Control "no-store";
        try_files /env.js =404;
    }

    # Hashed bundles and assets are immutable.
    location /_expo/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Social scrapers requesting an advert page receive SSR OpenGraph & Twitter Card tags
    location ~* ^/advert/([0-9a-fA-F-]+)/?$ {
        if ($is_crawler) {
            rewrite ^/advert/([0-9a-fA-F-]+)/?$ /_crawler_advert/$1 last;
        }
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html /index.html;
    }

    location ~* ^/_crawler_advert/([0-9a-fA-F-]+)$ {
        internal;
        resolver           __DNS_RESOLVERS__ valid=10s ipv6=off;
        set $upstream      ${BACKEND_URL};
        proxy_pass         $upstream/api/share/advert/$1$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 30s;
    }

    # Same-origin API: no CORS, no baked-in backend host.
    # The upstream is a variable on purpose: nginx then resolves it per request
    # instead of at startup, so the site stays up when the backend is restarting.
    location /api/ {
        resolver           __DNS_RESOLVERS__ valid=10s ipv6=off;
        set $upstream      ${BACKEND_URL};
        proxy_pass         $upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 120s;
    }

    location /actuator/ {
        resolver         __DNS_RESOLVERS__ valid=10s ipv6=off;
        set $actuator    ${BACKEND_URL};
        proxy_pass       $actuator$request_uri;
        proxy_set_header Host $host;
    }

    # The web app manifest may change between releases.
    location = /manifest.json {
        add_header Cache-Control "public, max-age=300";
        try_files /manifest.json =404;
    }

    # expo-router single-page output: every route falls back to index.html.
    # HTML is revalidated on every load so a redeploy is picked up immediately:
    # the new index.html references new hashed bundles, which then cache forever.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html $uri/index.html /index.html;
    }
}
