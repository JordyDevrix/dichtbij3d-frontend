server {
    listen       ${PORT};
    server_name  _;
    root         /usr/share/nginx/html;

    client_max_body_size 128M;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Runtime configuration; never cached so a container restart takes effect.
    location = /env.js {
        add_header Cache-Control "no-store";
        try_files /env.js =404;
    }

    # Hashed bundles and assets are immutable.
    location /_expo/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Same-origin API: no CORS, no baked-in backend host.
    location /api/ {
        proxy_pass         ${BACKEND_URL};
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /actuator/ {
        proxy_pass       ${BACKEND_URL};
        proxy_set_header Host $host;
    }

    # expo-router single-page output: every route falls back to index.html.
    location / {
        try_files $uri $uri.html $uri/index.html /index.html;
    }
}
